name: diftiri
description: "دفتري المحاسبي - نظام محاسبة ومبيعات عربي للمطاعم والبقالات"
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  mobile_scanner: ^7.4.2
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/diftiri_logo.jpg
    - assets/branding/diftiri_logo_vector.svg
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 700
