name: Build Diftiri

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diftiri-build-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate interactive web app
        run: |
          gunzip -c web/index.html.gz > /tmp/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\\s\\S]*?)</script>', html)
          Path('/tmp/diftiri-app.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert '<html' in html.lower()
          assert scripts, 'No inline application script found'
          PY
          node --check /tmp/diftiri-app.js

      - name: Prepare offline web package
        run: |
          mkdir -p build/diftiri-web
          gunzip -c web/index.html.gz > build/diftiri-web/index.html
          cp web/manifest.webmanifest web/sw.js build/diftiri-web/
          cp assets/branding/diftiri_logo.jpg build/diftiri-web/logo.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: diftiri-web-pwa
          path: build/diftiri-web/**

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.diftiri.accounting

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Test database
        run: timeout 60s flutter test test/database_test.dart -r expanded
      - name: Test dashboard phone layout
        run: timeout 60s flutter test test/widget_test.dart -r expanded
      - name: Test module phone layouts
        run: timeout 240s flutter test test/mobile_modules_test.dart -r expanded
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: diftiri-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform
        run: flutter create . --platforms=windows --org com.diftiri.accounting

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: diftiri-windows
          path: build/windows/x64/runner/Release/**
