name: Build Diftiri

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diftiri-build-v9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web platform
        run: flutter create . --platforms=web --org com.diftiri.accounting

      - run: flutter pub get

      - name: Install offline SQLite web binaries
        run: dart run sqflite_common_ffi_web:setup --force

      - run: flutter analyze --no-fatal-infos

      - name: Build responsive offline-capable web app
        run: flutter build web --release --base-href /diftiri/

      - uses: actions/upload-artifact@v4
        with:
          name: diftiri-web
          path: build/web/**

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.diftiri.accounting

      - name: Restore stable Android test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diftiri-android-test-signing-v1

      - name: Ensure stable Android test signing key
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Diftiri Test,O=Diftiri,C=YE"
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Test database
        run: timeout 60s flutter test test/database_test.dart -r expanded
      - name: Test dashboard phone layout
        run: timeout 60s flutter test test/widget_test.dart -r expanded
      - name: Test module phone layouts
        run: timeout 240s flutter test test/mobile_modules_test.dart -r expanded
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: diftiri-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform
        run: flutter create . --platforms=windows --org com.diftiri.accounting

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: diftiri-windows
          path: build/windows/x64/runner/Release/**
